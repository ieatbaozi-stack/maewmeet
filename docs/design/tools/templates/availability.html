<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title data-m="calendar.view.free"></title>
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="../../../src/styles/tokens.css">
<link rel="stylesheet" href="../../../src/styles/members.css">
<link rel="stylesheet" href="../../../src/components/brand/aurora.css">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="../../../src/styles/calendar.css">
<link rel="stylesheet" href="../../../src/styles/availability.css">
<script src="sample.js"></script>
<!--MESSAGES_EN-->
</head>
<body>
<div class="aurora" data-intensity="soft" aria-hidden="true"><div class="aurora-field"><span class="aurora-blob b1"></span><span class="aurora-blob b2"></span><span class="aurora-blob b3"></span><span class="aurora-blob b4"></span></div></div>
<div class="app">
  <header class="topbar">
    <button class="group-switch" data-m-aria="calendar.groupSwitch.label" data-m-v='{"group":"แก๊งมัธยม ห้อง 6/3"}'><span class="name">แก๊งมัธยม ห้อง 6/3</span><i data-icon="chevron-down" class="sm"></i></button>
    <button class="btn btn-secondary wide-only"><i data-icon="plus"></i><span data-m="busy.add"></span></button>
  </header>
  <main class="main wide cal-main" id="main" style="padding-bottom: calc(var(--tap-lg) + var(--space-7))">
    <div class="segmented cols-4 cal-views" role="group" data-m-aria="calendar.view.label"><button aria-pressed="false" data-m="calendar.view.month"></button><button aria-pressed="true" data-m="calendar.view.free"></button><button aria-pressed="false" data-m="calendar.view.day"></button><button aria-pressed="false" data-m="calendar.view.mine"></button></div>
    <div data-state-show="normal"><gen-avpage scn="normal"></gen-avpage></div>
    <div data-state-show="member" hidden><gen-avpage scn="normal" role="member"></gen-avpage></div>
    <div data-state-show="day" hidden><gen-avpage scn="normal" sel="2026-10-25" sheet="1"></gen-avpage></div>
    <div data-state-show="day-partial" hidden><gen-avpage scn="normal" sel="2026-10-22" sheet="1"></gen-avpage></div>
    <div data-state-show="day-nocommon" hidden><gen-avpage scn="normal" sel="2026-10-20" sheet="1"></gen-avpage></div>
    <div data-state-show="day-none" hidden><gen-avpage scn="normal" sel="2026-10-24" sheet="1"></gen-avpage></div>
    <div data-state-show="none" hidden><gen-avpage scn="none"></gen-avpage></div>
    <div data-state-show="none-nocommon" hidden><gen-avpage scn="nocommonbest"></gen-avpage></div>
    <div data-state-show="nobody" hidden><gen-avpage scn="nobody"></gen-avpage></div>
    <div data-state-show="twelve" hidden><gen-avpage scn="twelve"></gen-avpage></div>
    <div data-state-show="twelve-day" hidden><gen-avpage scn="twelve" sel="2026-10-24" sheet="1"></gen-avpage></div>
    <div data-state-show="wk6" hidden><gen-avpage scn="wk6"></gen-avpage></div>
    <div data-state-show="wk4" hidden><gen-avpage scn="wk4"></gen-avpage></div>
    <div data-state-show="truncated" hidden><gen-avpage scn="truncated"></gen-avpage></div>
    <div data-state-show="solo" hidden><gen-avpage scn="solo"></gen-avpage></div>
    <div data-state-show="loading" hidden aria-busy="true"><gen-avpage scn="loading"></gen-avpage></div>
    <div data-state-show="error" hidden>
      <div class="alert" role="alert" style="margin-top: var(--space-4)"><i data-icon="circle-alert"></i><div><b data-m="availability.error.title"></b><span data-m="availability.error.body"></span></div></div>
      <button class="btn btn-secondary" style="margin-top: var(--space-3)"><i data-icon="refresh-cw"></i><span data-m="states.retry"></span></button>
    </div>
    <div data-state-show="gone" hidden>
      <div class="empty panel" style="margin-top: var(--space-4)">
        <i data-cat="lost"></i>
        <h2 class="h-section" data-m="calendar.gone.title"></h2>
        <p class="muted" data-m="calendar.gone.body"></p>
        <button class="btn btn-primary" data-m="calendar.gone.cta"></button>
      </div>
    </div>
    <div data-state-show="nogroup" hidden>
      <div class="empty panel" style="margin-top: var(--space-4)">
        <i data-cat="calendar"></i>
        <h2 class="h-section" data-m="empty.calendarNoGroup.title"></h2>
        <p class="muted" data-m="empty.calendarNoGroup.body"></p>
        <button class="btn btn-primary" data-m="empty.calendarNoGroup.cta"></button>
      </div>
    </div>
  </main>
  <button class="btn btn-primary fab mobile-only" data-state-hide="error gone loading nogroup solo day day-partial day-nocommon day-none twelve-day"><i data-icon="plus"></i><span data-m="busy.add"></span></button>
  <nav class="tabbar" data-m-aria="nav.label">
    <a class="tab" href="home.html"><i data-icon="house"></i><span data-m="nav.home"></span></a>
    <a class="tab" href="calendar-month.html" aria-current="page"><i data-icon="calendar"></i><span data-m="nav.calendar"></span></a>
    <a class="tab" href="groups.html"><i data-icon="users"></i><span data-m="nav.groups"></span></a>
    <a class="tab" href="#"><i data-icon="user"></i><span data-m="nav.me"></span></a>
  </nav>
</div>
</body>
</html>
