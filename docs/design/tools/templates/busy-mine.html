<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title data-m="busy.mine.title"></title>
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="../../../src/styles/tokens.css">
<link rel="stylesheet" href="../../../src/styles/members.css">
<link rel="stylesheet" href="../../../src/components/brand/aurora.css">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="../../../src/styles/calendar.css">
<script src="sample.js"></script>
<!--MESSAGES_EN-->
</head>
<body>
<div class="aurora" data-intensity="soft" aria-hidden="true"><div class="aurora-field"><span class="aurora-blob b1"></span><span class="aurora-blob b2"></span><span class="aurora-blob b3"></span><span class="aurora-blob b4"></span></div></div>
<div class="app">
  <header class="topbar">
    <button class="group-switch" data-m-aria="calendar.groupSwitch.label" data-m-v='{"group":"แก๊งมัธยม ห้อง 6/3"}'><span class="name">แก๊งมัธยม ห้อง 6/3</span><i data-icon="chevron-down" class="sm"></i></button>
    <button class="btn btn-secondary wide-only"><i data-icon="plus"></i><span data-m="busy.add"></span></button>
  </header>
  <main class="main" id="main" style="padding-bottom: calc(var(--tap-lg) + var(--space-7))">
    <div class="segmented cal-views" role="group" data-m-aria="calendar.view.label"><button aria-pressed="false" data-m="calendar.view.month"></button><button aria-pressed="false" data-m="calendar.view.day"></button><button aria-pressed="true" data-m="calendar.view.mine"></button></div>
    <div class="busy-head"><h2 data-m="busy.mine.title"></h2><p data-m="busy.mine.lead"></p></div>
    <div data-state-show="saved" hidden><p class="alert alert-free toast" role="status" style="margin-top: var(--space-3)"><i data-icon="circle-check"></i><span data-m="busy.toast.saved"></span></p></div>
    <div data-state-show="deleted" hidden><p class="alert alert-free toast" role="status" style="margin-top: var(--space-3)"><i data-icon="circle-check"></i><span data-m="busy.toast.deleted"></span></p></div>
    <div data-state-show="list saved deleted near">
      <p class="small muted" style="margin-top: var(--space-3)" role="status" data-m="busy.mine.count" data-m-v='{"count":6}'></p>
      <div data-state-show="near" hidden><p class="alert alert-warn" style="margin-top: var(--space-3)"><i data-icon="triangle-alert"></i><span data-m="busy.mine.limitNear" data-m-v='{"count":285,"max":300}'></span></p></div>
      <gen-mine></gen-mine>
    </div>
    <div data-state-show="empty" hidden>
      <div class="empty panel" style="margin-top: var(--space-4)">
        <i data-cat="sleep"></i>
        <h3 class="h-section" data-m="busy.mine.empty.title"></h3>
        <p class="muted" data-m="busy.mine.empty.body"></p>
        <button class="btn btn-primary"><i data-icon="plus"></i><span data-m="busy.add"></span></button>
      </div>
    </div>
    <div data-state-show="loading" hidden aria-busy="true">
      <div class="skeleton" style="height: calc(var(--space-7) * 1.5); margin-top: var(--space-4)"></div>
      <div class="skeleton" style="height: calc(var(--space-7) * 1.5); margin-top: var(--space-3)"></div>
      <div class="skeleton" style="height: calc(var(--space-7) * 1.5); margin-top: var(--space-3)"></div>
      <p class="loading-note" role="status" data-m="busy.mine.loading"></p>
    </div>
    <div data-state-show="error" hidden>
      <div class="alert" role="alert" style="margin-top: var(--space-4)"><i data-icon="circle-alert"></i><div><b data-m="busy.mine.error.title"></b><span data-m="busy.mine.error.body"></span></div></div>
      <button class="btn btn-secondary" style="margin-top: var(--space-3)"><i data-icon="refresh-cw"></i><span data-m="states.retry"></span></button>
    </div>
  </main>
  <button class="btn btn-primary fab mobile-only" data-state-hide="empty loading error"><i data-icon="plus"></i><span data-m="busy.add"></span></button>
  <nav class="tabbar" data-m-aria="nav.label">
    <a class="tab" href="home.html"><i data-icon="house"></i><span data-m="nav.home"></span></a>
    <a class="tab" href="calendar-month.html" aria-current="page"><i data-icon="calendar"></i><span data-m="nav.calendar"></span></a>
    <a class="tab" href="groups.html"><i data-icon="users"></i><span data-m="nav.groups"></span></a>
    <a class="tab" href="#"><i data-icon="user"></i><span data-m="nav.me"></span></a>
  </nav>
</div>
</body>
</html>
