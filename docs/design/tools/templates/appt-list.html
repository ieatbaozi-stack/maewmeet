<body>
<div class="aurora" data-intensity="soft" aria-hidden="true"><div class="aurora-field"><span class="aurora-blob b1"></span><span class="aurora-blob b2"></span><span class="aurora-blob b3"></span><span class="aurora-blob b4"></span></div></div>
<div class="app">
  <div data-state-show="normal upcoming"><gen-appt page="list" scn="upcoming"></gen-appt></div>
  <div data-state-show="past" hidden><gen-appt page="list" scn="past"></gen-appt></div>
  <div data-state-show="empty-upcoming" hidden><gen-appt page="list" scn="empty-upcoming"></gen-appt></div>
  <div data-state-show="empty-past" hidden><gen-appt page="list" scn="empty-past"></gen-appt></div>
  <div data-state-show="loading" hidden><gen-appt page="list" scn="loading"></gen-appt></div>
  <div data-state-show="error" hidden><gen-appt page="list" scn="error"></gen-appt></div>
  <div data-state-show="near-limit" hidden><gen-appt page="list" scn="near-limit"></gen-appt></div>
  <div data-state-show="long" hidden><gen-appt page="list" scn="long"></gen-appt></div>
  <div data-state-show="past-capped" hidden><gen-appt page="list" scn="past-capped"></gen-appt></div>
  <nav class="tabbar" data-m-aria="nav.label">
    <a class="tab" href="home.html"><i data-icon="house"></i><span data-m="nav.home"></span></a>
    <a class="tab" href="availability.html"><i data-icon="calendar"></i><span data-m="nav.calendar"></span></a>
    <a class="tab" aria-current="page" href="groups.html"><i data-icon="users"></i><span data-m="nav.groups"></span></a>
