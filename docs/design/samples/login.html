      <button class="key ghost" aria-label="ลบ" data-t-aria="del"><svg class="icon lg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M10 5a2 2 0 0 0-1.344.519l-6.328 5.74a1 1 0 0 0 0 1.481l6.328 5.741A2 2 0 0 0 10 19h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2z" /> <path d="m12 9 6 6" /> <path d="m18 9-6 6" /></svg></button>

</main>
<script>
  // หน้าตัวอย่าง: สลับโลโก้/ลิงก์ภาษาตาม ?lang และคง ?theme ไว้ในลิงก์
  (function () {
    var q = new URLSearchParams(location.search), en = q.get('lang') === 'en', t = q.get('theme');
    document.querySelector('.js-logo-th').toggleAttribute('hidden', en);
    document.querySelector('.js-logo-en').toggleAttribute('hidden', !en);
    document.querySelector('.js-th').setAttribute('aria-current', String(!en));
    document.querySelector('.js-en').setAttribute('aria-current', String(en));
    if (t) document.querySelectorAll('.lang-switch a').forEach(function (a) { a.href += '&theme=' + t; });
  })();
</script>
